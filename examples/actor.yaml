schemaVersion: 1
kind: actor
meta:
  name: Border Warden
  actorType: npc
  level: 4
  freeArchetype: false
  source: "Dev"

core:
  traits: [humanoid]
  rarity: common
  size: medium
  ancestry: human
  languages: [common, draconic, Dranuran Cant]
  abilities: { str: 4, dex: 2, con: 3, int: 0, wis: 2, cha: 1 }
  perception: { mod: 11, senses: ["low-light vision", "scent (imprecise) 30 feet"] }
  ac: 21
  saves: { fortitude: 13, reflex: 10, will: 11 }
  hp: { value: 60 }
  speed: { value: 25, other: [{ type: climb, value: 15 }] }
  skills:
    named: { athletics: 12, intimidation: 9, survival: 11 }
    lore: [{ name: "Dranura Politics", mod: 8 }]
  resistances: [{ type: fire, value: 5 }]
  weaknesses: []
  immunities: []

items:
  - origin: compendiumRef
    refType: action
    lookup: { name: "Reactive Strike" }

  - origin: equippedWeapon
    lookup: { name: "Longsword" }
    proficiency: expert
    runes: { potency: 1, striking: 1 }

  - origin: equippedWeapon
    lookup: { name: "Shortbow" }
    proficiency: trained
    keepInInventory: false

  - origin: homebrew
    type: melee
    name: Shield Bash
    attackBonus: 13
    damageRolls: [{ damage: "1d6+4", damageType: bludgeoning }]
    traits: [agile]
    attackEffects: [knockdown-crash]

  - origin: homebrew
    type: action
    name: Knockdown Crash
    actionType: 1
    category: offensive
    traits: [attack]
    description: "<p>The warden slams the target. It must succeed at a @Check[fortitude|dc:21] save or fall [[prone]].</p>"

  - origin: homebrew
    type: action
    name: Hold the Line
    actionType: reaction
    category: defensive
    trigger: "An ally within 10 feet is hit by a melee attack."
    description: "The warden steps in; the ally gains resistance 5 to the triggering damage and the attacker is [[off-guard]] until the end of its turn. Roll [[/r 1d4]] rounds of shaking afterward."

spellcasting:
  - name: Warden Innate Spells
    tradition: primal
    type: innate
    ability: wis
    dc: 21
    attack: 13
    spells:
      cantrips: [Know the Way]
      rank1:
        - { name: Pass Without Trace, uses: constant }
      rank2:
        - { origin: compendiumRef, lookup: { name: Heal, pack: spells-srd }, uses: 2 }
        - origin: homebrew
          type: spell
          name: Border Ward
          rank: 1
          traditions: [primal]
          traits: [earth]
          actions: 2
          range: 30
          area: { type: burst, value: 10 }
          defense: { save: reflex, basic: true }
          damage: [{ formula: 2d6, type: bludgeoning }]
          heightening: { every: 1, damage: [1d6] }
          description: "Stones erupt from the ground. Creatures that fail are knocked [[prone]]."
